[package]
name = "rustlink-discord-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Discord Gateway v10 client and voice-state pairing for Rustlink bots"

[dependencies]
rustlink-client = { path = "../client" }
rustlink-protocol.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
url = "2"
zeroize = "1"
