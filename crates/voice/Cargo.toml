[package]
name = "rustlink-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Discord voice gateway, UDP transport and Opus payload encryption"

[dependencies]
rustlink-protocol.workspace = true
rustlink-dave.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
aes-gcm = "0.10"
zeroize = "1"

[dev-dependencies]
rustlink-audio.workspace = true
openmls = "=0.8.1"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5.1"
davey = "=0.1.5"

[[bench]]
name = "transport"
harness = false
