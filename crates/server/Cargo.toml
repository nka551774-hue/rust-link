[package]
name = "rustlink-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "REST and WebSocket surface, sessions, players, metrics and webhooks"

[dependencies]
rustlink-protocol.workspace = true
rustlink-config.workspace = true
rustlink-audio.workspace = true
rustlink-source.workspace = true
rustlink-lyrics.workspace = true
rustlink-voice.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
subtle = "2"
sysinfo = "0.37"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ureq = { version = "3", features = ["json"] }
url = "2"

[dev-dependencies]
rustlink-client = { path = "../client" }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.27"
