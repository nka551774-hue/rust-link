[package]
name = "rustlink-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Filter model, in-process DSP pipeline and the FFmpeg fallback engine"

[dependencies]
rustlink-protocol.workspace = true
# Keep common source codecs in-process so AAC/MP4, MP3, FLAC, Vorbis and WAV avoid FFmpeg.
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "adpcm",
    "alac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
serde_json = "1"
thiserror = "2"

[features]
default = ["native-opus"]
# Link system libopus for in-process Opus decode/encode; falls back to FFmpeg when disabled.
native-opus = []

[[bench]]
name = "hot_paths"
harness = false
