# --- Node ---
address: 0.0.0.0:2333                      # listen address; 127.0.0.1 behind a reverse proxy
password: ""                               # required Bearer password

# --- Media tools ---
ffmpeg: ffmpeg                             # path, bare name in toolsDirectory, or none
toolsDirectory: .tools
autoDownload: false
inProcessAudio: true
lyricsSource: lrclib                       # lrclib (with YouTube Music fallback) or none

# --- Logging ---
logLevel: info                             # debug, info, warn, error
logFormat: text                            # text or json
logColor: auto                             # auto, always, never
logDirectory: logs                         # empty logs to console only
logRetentionDays: 14                       # 0 keeps all files

# --- YouTube ---
youtubeNative: true
youtubeEndpoint: https://youtubei.googleapis.com
youtubeMusicEndpoint: https://music.youtube.com
youtubeClientVersion: ""
youtubePoTokenFile: potoken.yaml           # dedicated PO token config (auto-reloaded on save)
youtubeRequirePoToken: false               # true = refuse YouTube until potoken.yaml has a token
youtubePoToken: ""
youtubeGvsPoToken: ""
youtubePlayerPoToken: ""
youtubeVisitorData: ""
youtubeProxy: ""                           # http://, https://, socks4://, socks5://, socks5h://

# --- SoundCloud ---
soundcloudNative: true
soundcloudApiEndpoint: https://api-v2.soundcloud.com
soundcloudWebEndpoint: https://soundcloud.com
soundcloudClientId: ""
soundcloudClientIdTtlSeconds: 21600

# --- Spotify ---
spotifyClientId: ""
spotifyClientSecret: ""
spotifyRefreshToken: ""
spotifyMarket: US

# --- Deezer ---
deezerApiEndpoint: https://api.deezer.com

# --- Filters ---
filters:
  volume: true
  equalizer: true
  karaoke: true
  timescale: true
  tremolo: true
  vibrato: true
  distortion: true
  rotation: true
  channelMix: true
  lowPass: true

# --- Capacity ---
maxPlayers: 100
maxSessions: 100
maxConcurrentLoads: 8
maxPlaylistTracks: 100
searchResults: 5
cacheEntries: 1024
cacheTtlSeconds: 300
loadTimeoutSeconds: 30
playerUpdateSeconds: 5
statsSeconds: 60
eventBuffer: 256
opusBitrate: 192000
opusComplexity: 10

# --- Ratelimits & Webhook ---
ratelimits:
  enable: true

webhook:
  enable: false
  url: ""
  stateLatencySeconds: 5

# --- Security ---
allowPrivateNetworks: false
