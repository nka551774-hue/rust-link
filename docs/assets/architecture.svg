  <text x="900" y="214" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#d93a49">Fail-Closed · Zeroize Keys</text>

  <line x1="980" y1="232" x2="980" y2="252" stroke="#d93a49" stroke-width="1.6" marker-end="url(#arrowCrimson)"/>

  <rect x="888" y="256" width="184" height="106" rx="8" fill="#0d1117" stroke="#d93a49" stroke-opacity="0.6" stroke-width="1"/>
  <text x="900" y="279" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e6edf3">rustlink-voice</text>
  <text x="900" y="298" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">Voice Gateway v8 + UDP Probe</text>
  <text x="900" y="315" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">AES-256-GCM / XChaCha20 RTP</text>
  <text x="900" y="332" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">Recycled Packet Pool</text>
  <text x="900" y="349" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#39c5bb">0 Heap Allocs / Frame</text>

