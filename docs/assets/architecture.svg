    <tspan fill="#39c5bb">RUST</tspan><tspan fill="#d93a49">LINK</tspan>
    <tspan fill="#8b949e" font-weight="500" font-size="14">  ·  11-Crate Pure-Rust Workspace Architecture (Zero Node / JVM / Python / yt-dlp)</tspan>
  </text>
  <line x1="32" y1="54" x2="1088" y2="54" stroke="#21262d" stroke-width="1"/>

