  <text x="604" y="330" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">libopus 192 kbps + FFmpeg Fallback</text>
  <text x="604" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#d93a49">Live Glitch-Free DSP Reconfigure</text>

