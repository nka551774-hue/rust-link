<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" role="img" aria-label="Rustlink vs Lavalink vs NodeLink vs Go Nodes vs yt-dlp Architecture and Resource Comparison">
  <defs>
    <linearGradient id="bgCmp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131922"/>
    </linearGradient>
    <linearGradient id="rustBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#2ea097"/>
    </linearGradient>
    <linearGradient id="goBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="nodeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#bb8009"/>
    </linearGradient>
    <linearGradient id="jvmBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d93a49"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="pyBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#6e7681"/>
    </linearGradient>
    <linearGradient id="rowHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39c5bb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39c5bb" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="530" rx="14" fill="url(#bgCmp)" stroke="#30363d" stroke-width="1.5"/>
  <text x="32" y="38" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#e6edf3">
    <tspan fill="#39c5bb">RUSTLINK</tspan> vs <tspan fill="#d93a49">LAVALINK</tspan> · <tspan fill="#d29922">NODELINK</tspan> · <tspan fill="#58a6ff">GO NODES</tspan> · <tspan fill="#8b949e">YT-DLP</tspan>
    <tspan fill="#8b949e" font-weight="500" font-size="13">  ·  Runtime &amp; Architectural Profile</tspan>
  </text>
  <line x1="32" y1="54" x2="1088" y2="54" stroke="#21262d" stroke-width="1"/>
  <rect x="32" y="72" width="516" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="50" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#39c5bb">TYPICAL IDLE MEMORY FOOTPRINT (BASE RSS · LOWER IS BETTER)</text>
  <text x="50" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#e6edf3">Rustlink (Rust)</text>
  <rect x="190" y="113" width="22" height="14" rx="3" fill="url(#rustBar)"/>
  <text x="220" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#39c5bb">~12–18 MiB  (9.7 MiB binary, 0 VM)</text>
  <text x="50" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Go Audio / GoLink</text>
  <rect x="190" y="141" width="46" height="14" rx="3" fill="url(#goBar)"/>
  <text x="244" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">~25–45 MiB  (Go runtime + cgo)</text>
  <text x="50" y="180" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">NodeLink (Node/V8)</text>
  <rect x="190" y="169" width="124" height="14" rx="3" fill="url(#nodeBar)"/>
  <text x="322" y="180" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">~75–130 MiB  (V8 isolate + JIT)</text>
  <text x="50" y="208" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Bot + yt-dlp/FFmpeg</text>
  <rect x="190" y="197" width="165" height="14" rx="3" fill="url(#pyBar)"/>
  <text x="363" y="208" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">+60–120 MiB per active extract</text>
  <text x="50" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Lavalink (Java/JVM)</text>
  <rect x="190" y="225" width="295" height="14" rx="3" fill="url(#jvmBar)"/>
  <text x="492" y="236" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#f85149">~220–450+ MiB</text>
  <text x="50" y="256" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#6e7681">Managed runtimes reserve heap + JIT code cache upfront before the first player starts.</text>
  <rect x="568" y="72" width="520" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="586" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#d93a49">COLD START TIME &amp; 20 ms FRAME JITTER SOURCES</text>
  <text x="586" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#e6edf3">Rustlink</text>
  <rect x="708" y="113" width="10" height="14" rx="3" fill="url(#rustBar)"/>
  <text x="726" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#39c5bb">&lt; 15 ms  ·  0 GC pauses · 0 hot-path allocs</text>
  <text x="586" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Go Nodes</text>
  <rect x="708" y="141" width="28" height="14" rx="3" fill="url(#goBar)"/>
  <text x="744" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">~30–80 ms  ·  Concurrent GC + cgo stack switch</text>
  <text x="586" y="180" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">NodeLink</text>
  <rect x="708" y="169" width="110" height="14" rx="3" fill="url(#nodeBar)"/>
  <text x="826" y="180" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">~300–900 ms  ·  V8 GC + JS event-loop stalls</text>
  <text x="586" y="208" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">yt-dlp Pipe</text>
  <rect x="708" y="197" width="185" height="14" rx="3" fill="url(#pyBar)"/>
  <text x="901" y="208" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">~800–2500 ms per track spawn</text>
  <text x="586" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Lavalink</text>
  <rect x="708" y="225" width="340" height="14" rx="3" fill="url(#jvmBar)"/>
  <text x="1072" y="256" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#f85149">Lavalink Spring Boot + JIT warm-up: ~2,000–6,000 ms</text>
  <rect x="32" y="284" width="1056" height="224" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="50" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e">SOLUTION</text>
  <text x="235" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e">RUNTIME / GC</text>
  <text x="425" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e">SOURCE STREAMING</text>
  <text x="645" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e">DSP &amp; RESAMPLER</text>
  <text x="860" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e">DAVE v1 E2EE + RTP</text>
  <line x1="46" y1="320" x2="1072" y2="320" stroke="#21262d" stroke-width="1"/>
  <rect x="42" y="326" width="1036" height="34" rx="6" fill="url(#rowHighlight)" stroke="#39c5bb" stroke-opacity="0.45" stroke-width="1"/>
  <text x="52" y="347" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#39c5bb">Rustlink</text>
  <text x="235" y="347" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">Native Rust · Zero GC</text>
  <text x="425" y="347" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">512 KiB Range + 2 MiB Prefetch</text>
  <text x="645" y="347" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">SIMD Biquad/Sinc (0 allocs)</text>
  <text x="860" y="347" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#39c5bb">In-proc OpenMLS · 490 ns</text>
  <text x="52" y="381" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#f85149">Lavalink</text>
  <text x="235" y="381" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">JVM 17/21 · G1GC / ZGC</text>
  <text x="425" y="381" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Lavaplayer HTTP + Plugins</text>
  <text x="645" y="381" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Java float[] + JNI Opus/DSP</text>
  <text x="860" y="381" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">JNI libdave / JNA bridge</text>
  <text x="52" y="413" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#d29922">NodeLink</text>
  <text x="235" y="413" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Node.js V8 · Generational GC</text>
  <text x="425" y="413" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">JS Streams + Worker Pool</text>
  <text x="645" y="413" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">JS TypedArray + N-API Opus</text>
  <text x="860" y="413" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">N-API native addon</text>
  <text x="52" y="445" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#58a6ff">Go Nodes / GoLink</text>
  <text x="235" y="445" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Go Runtime · Mark-Sweep GC</text>
  <text x="425" y="445" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">net/http Readers</text>
  <text x="645" y="445" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#c9d1d9">Go slices + cgo Opus FFI</text>
  <text x="860" y="445" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">cgo / external DAVE lib</text>
  <text x="52" y="477" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#8b949e">yt-dlp + FFmpeg</text>
  <text x="235" y="477" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">Python + OS Subprocesses</text>
  <text x="425" y="477" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">Spawn per track / pipe I/O</text>
  <text x="645" y="477" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">Restart FFmpeg on filter edit</text>
  <text x="860" y="477" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b949e">Bot-side FFI / bindings</text>
  <text x="52" y="499" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#6e7681">Note: Lavalink/NodeLink/Go values reflect typical runtime baselines; Rustlink metrics are measured directly on this codebase (--release).</text>
</svg>
