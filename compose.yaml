services:
  rustlink:
    image: rustlink:local
    build: .
    init: true
    ports:
      - "127.0.0.1:2333:2333"
    environment:
      RUSTLINK_PASSWORD: ${RUSTLINK_PASSWORD:?set RUSTLINK_PASSWORD}
      MALLOC_ARENA_MAX: "2"
      RUSTLINK_LOG_DIRECTORY: ""
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-US}
      RUSTLINK_YOUTUBE_PROXY: ${RUSTLINK_YOUTUBE_PROXY:-}
      RUSTLINK_YOUTUBE_PO_TOKEN_FILE: ${RUSTLINK_YOUTUBE_PO_TOKEN_FILE:-}
      RUSTLINK_YOUTUBE_REQUIRE_PO_TOKEN: ${RUSTLINK_YOUTUBE_REQUIRE_PO_TOKEN:-true}
      RUSTLINK_YOUTUBE_PO_TOKEN: ${RUSTLINK_YOUTUBE_PO_TOKEN:-}
      RUSTLINK_YOUTUBE_VISITOR_DATA: ${RUSTLINK_YOUTUBE_VISITOR_DATA:-}
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  rustlink-bot:
    profiles: ["bot"]
    image: rustlink:local
    build: .
    init: true
    entrypoint: ["rustlink-bot"]
    depends_on: [rustlink]
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      RUSTLINK_PASSWORD: ${RUSTLINK_PASSWORD:?set RUSTLINK_PASSWORD}
      RUSTLINK_URL: http://rustlink:2333
      DISCORD_GUILD_IDS: ${DISCORD_GUILD_IDS:-}
      BOT_DEFAULT_VOLUME: ${BOT_DEFAULT_VOLUME:-100}
      BOT_MAX_QUEUE: ${BOT_MAX_QUEUE:-100}
      BOT_IDLE_LEAVE_SECONDS: ${BOT_IDLE_LEAVE_SECONDS:-120}
      MALLOC_ARENA_MAX: "2"
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
