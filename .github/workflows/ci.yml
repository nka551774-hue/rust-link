name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libopus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash -n install.sh start.sh quickstart/start.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check -p rustlink-audio --no-default-features --locked
      - run: cargo test --workspace --locked
      - run: bash start.sh --version
        env:
          RUSTLINK_SKIP_BOOTSTRAP: '1'

  windows:
    name: tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-pkgconf
      - name: clippy and test
        shell: msys2 {0}
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: launch script
        shell: cmd
        env:
          RUSTLINK_SKIP_BOOTSTRAP: '1'
          RUSTLINK_NO_PAUSE: '1'
          RUSTLINK_MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: start.bat --version
